<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400&display=swap" rel="stylesheet">
    <script type="text/javascript" th:src="'//dapi.kakao.com/v2/maps/sdk.js?appkey='+${@environment.getProperty('multi-semi.kakao-api')}+'&libraries=services'"></script>
    <script src="/js/detail.js"></script>
    <link rel="stylesheet" type="text/css" th:href="@{/css/detail.css}">
    <title>상세 정보</title>
</head>
<body>
<div th:replace="/common/header.html"></div>
<main>
    <div class="content-wrapper">
        <div class="detail-container">
            <h2><span th:text="${travel.title}"></span></h2>
            <div th:if="${travel != null}">
                <p><strong>No:</strong> <span th:text="${travel.no}"></span></p>
                <p><strong>District:</strong> <span th:text="${travel.district}"></span></p>
                <p><strong>Title:</strong> <span th:text="${travel.title}"></span></p>
                <p><strong>Description:</strong> <span th:text="${travel.description}"></span></p>
                <p><strong>Address:</strong> <span th:text="${travel.address}"></span></p>
                <p><strong>Phone:</strong> <span th:text="${travel.phone}"></span></p>
            </div>
            <div th:unless="${travel != null}">
                <p>해당하는 정보가 없습니다.</p>
            </div>
        </div>
        <div class="img-content">
            <!--            <img src="/img/suwon.jpg" alt="상세 이미지">-->
            <div id="roadview" style="width:100%;height:50vh"></div>
            <a th:href="@{/district/map(no=${travel.no})}" class="explore-btn">주변 관광지 탐색</a>
        </div>
    </div>
</main>



<div th:replace="/common/footer.html"></div>

<script th:inline="javascript">
    var geocoder = new kakao.maps.services.Geocoder();

    var roadviewContainer = document.getElementById('roadview'); //로드뷰를 표시할 div
    var roadview = new kakao.maps.Roadview(roadviewContainer); //로드뷰 객체
    var roadviewClient = new kakao.maps.RoadviewClient(); //좌표로부터 로드뷰 파노ID를 가져올 로드뷰 helper객체

    let position = new Array();

    document.addEventListener("DOMContentLoaded",async ()=>{

        let address = [[${travel.address}]];//'경기도 고양시 덕양구 행주외동 140-8', "인천광역시 중구 제물량로232번안길 27"


        position.push({placeInfo:{

            }});

        await getCoords(address); // position[0]: 상세보기 페이지에서 가져온 정보, 주소로 위도와 경도를 얻음
        //console.log(position[0].placeInfo);

        var positionkakao = new kakao.maps.LatLng(position[0].placeInfo.mapy, position[0].placeInfo.mapx);

        // 특정 위치의 좌표와 가까운 로드뷰의 panoId를 추출하여 로드뷰를 띄운다.
        roadviewClient.getNearestPanoId(positionkakao, 500, function(panoId) {
            roadview.setPanoId(panoId, positionkakao); //panoId와 중심좌표를 통해 로드뷰 실행
        });


    })

</script>

</body>
</html>
