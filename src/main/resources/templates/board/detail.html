<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity5">
<head>
  <meta charset="UTF-8">
  <title>TRIPSPOT</title>
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400&display=swap" rel="stylesheet">
  <link rel="stylesheet" type="text/css" href="/css/search.css">
  <script src="/js/search.js" defer></script>

</head>
<body>

<div th:replace="/common/header.html"></div>


<main>
  <h1>게시글 상세</h1>

  <!-- 게시글이 존재하지 않을 경우 -->
  <p th:if="${board == null}">
    <span th:text="${currentUser}"></span>님의 게시글이 존재하지 않습니다.
  </p>

  <div th:if="${board != null}">
    <h2 th:text="${board.title}"></h2>
    <hr>
    <p><strong>작성자:</strong> <span th:text="${board.memberId}"></span></p>
    <p><strong>작성일:</strong> <span th:text="${#temporals.format(board.createdDate, 'yyyy-MM-dd HH:mm')}"></span></p>
    <p><strong>조회수:</strong> <span th:text="${board.viewCount}"></span></p>
    <hr>
    <div>
      <p th:text="${board.content}"></p>
    </div>
    <hr>
    <div>
      <a href="/board"><button>목록으로</button></a>

      <!-- 작성자 또는 관리자만 수정/삭제 버튼 표시 -->
      <span th:if="${currentUser == board.memberId or isAdmin}">
                <a th:href="@{'/board/edit/' + ${board.boardNo}}"><button>수정</button></a>
                <form th:action="|@{/board/delete/}${board.boardNo}|"  style="display:inline;">
                    <button type="submit">삭제</button>
                </form>
            </span>
    </div>
  </div>
</main>

<div th:replace="/common/footer.html"></div>

</body>
</html>
