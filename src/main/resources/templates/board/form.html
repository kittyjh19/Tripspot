<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>게시글 작성</title>
</head>
<body>
<h2 th:text="${board != null} ? '✏️ 게시글 수정' : '✏️ 새 글 작성'"></h2>

<form th:action="@{${actionUrl}}" method="post">
  <div>
    <label>제목</label><br>
    <input type="text" name="title" th:value="${board?.title}" required style="width: 80%;">
  </div>
  <br>
  <div>
    <label>내용</label><br>
    <textarea name="content" rows="10" style="width: 100%;" required
              th:text="${board?.content}"></textarea>
  </div>
  <br>
  <div>
    <label><input type="checkbox" name="isNotice" th:checked="${board?.notice}"> 공지로 등록</label>
  </div>
  <br>
  <button type="submit">작성 완료</button>
  <a href="/board"><button type="button">목록으로</button></a>
</form>
</body>
</html>
