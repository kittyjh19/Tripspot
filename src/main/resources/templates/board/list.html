<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity5">
<head>
  <meta charset="UTF-8">
  <title>게시판</title>

  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400&display=swap" rel="stylesheet">
  <link rel="stylesheet" type="text/css" th:href="@{/css/boardlist.css}">
</head>
<body>


<div th:replace="/common/header.html"></div>

<main>
  <div class="board-header">
    <h2>게시판</h2>
    <a href="/board/write">
      <button class="board-write-btn">✏️ 새 글 작성</button>
    </a>
  </div>

  <table class="board-table">
    <thead>
    <tr>
      <th>번호</th>
      <th>제목</th>
      <th>작성자</th>
      <th>조회수</th>
      <th>작성일</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="post, stat : ${boardList}">
      <td th:text="${stat.count}"></td>
      <td>
        <a th:href="@{/board/detail/{no}(no=${post.boardNo})}">
          <span th:if="${post.boardType == 'NOTICE'}" class="notice-title">[공지] </span>
          <span th:text="${post.title}"></span>
        </a>
      </td>
      <td th:text="${post.memberId}"></td>
      <td th:text="${post.viewCount}"></td>
      <td th:text="${#temporals.format(post.createdDate, 'yyyy-MM-dd HH:mm')}"></td>
    </tr>
    </tbody>
  </table>

  </div>

  <div class="pagination">
    <a th:if="${currentPage > 1}" th:href="@{/board(page=${currentPage - 1})}">&lt;</a>
    <span th:unless="${currentPage > 1}" class="disabled">&lt;</span>

    <th:block th:each="page : ${#numbers.sequence(1, totalPages)}">
      <a th:href="@{/board(page=${page})}" th:class="${currentPage == page} ? 'active'" th:text="${page}"></a>
    </th:block>

    <a th:if="${currentPage < totalPages}" th:href="@{/board(page=${currentPage + 1})}">&gt;</a>
    <span th:unless="${currentPage < totalPages}" class="disabled">&gt;</span>
  </div>
</main>


<div th:replace="/common/footer.html"></div>

</body>
</html>
