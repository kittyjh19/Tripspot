<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity5">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<style>
    button{
        padding: 13px 30px;
        margin-top: 50px;
        font-size: 17px;
        font-family: 'Nanum Gothic', sans-serif;
        background-color: #FDFDFC;
        color: #256137;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        transition: background-color 0.3s;
    }

    button:hover{
        background-color: #C9E2D0;
    }

</style>
<body>
<header>
    <a href="/" style="text-decoration: none; color: inherit;"><h1>| TRIPSPOT</h1></a>
    <div style="text-align: right">
        <div style="display: flex; flex-direction: column; align-items: flex-end;">
            <th:block sec:authorize="isAuthenticated()">
                <h3 style="margin: 0;">
                    <span sec:authentication="principal.username"></span>님 환영합니다
                </h3>
                <h3 style="margin: 5px 0;">
                    권한:
                    <span th:if="${#authorization.expression('isAuthenticated()')}">
                <span th:each="auth : ${#authentication.getAuthorities()}">
                    <span th:text="${auth.authority == 'ROLE_USER' ? '일반 유저' : (auth.authority == 'ROLE_ADMIN' ? '관리자' : '알 수 없는 권한')}"></span>
                </span>
            </span>
                    <span th:unless="${#authorization.expression('isAuthenticated()')}">권한 정보 없음</span>
                </h3>
                <button onclick="location.href='/member/logout'" style="margin-top: 5px;">로그아웃</button>
            </th:block>
        </div>
        <th:block sec:authorize="isAnonymous()">
            <button class="register-button" onclick="location.href='/member/register'">회원가입</button>
            <button class="login-button" onclick="location.href='/member/login'">로그인</button>
        </th:block>
    </div>
</header>
</body>
</html>
