<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity5">
<head>

<head>
    <meta charset="UTF-8">
    <title>TRIPSPOT</title>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/main.css">

    <style>
        input[type="text"], input[type="password"],input[type="email"],input[type="password"] {

            padding: 10px;
            font-size: 1em;
            margin-top: 5px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        button {
            padding: 10px 20px;              /* Adds some space inside the button */
            font-size: 16px;                 /* Set a nice font size */
            font-family: 'Comfortaa', sans-serif; /* Matches your other text */
            border: 2px solid #4CAF50;       /* Green border to match the Bootstrap class */
            border-radius: 5px;              /* Slightly rounded corners */
            background-color: #fff;          /* White background */
            color: #4CAF50;                  /* Green text color to match the border */
            cursor: pointer;                /* Pointer cursor on hover */
            transition: all 0.3s ease;       /* Smooth transition for effects */
        }
    </style>
</head>
<body>
<div th:replace="/common/header.html"></div>
<div class="container">
    <h1 style="text-align: center">회원 가입</h1>
    <form style="text-align: center" th:action="@{/member/register}" method="post">

        <div class="form-group">
            <label for="id">아이디:</label>
            <input type="text" class="form-control" id="id" name="id" required>
        </div>
        <div class="form-group">
            <label for="pw">비밀번호:</label>
            <input type="password" class="form-control" id="pw" name="pw" required>
        </div>
        <div class="form-group">
            <label for="email">이메일:</label>
            <input type="email" class="form-control" id="email" name="memberEmail" required>
        </div>
        <div class="form-group">
            <label for="name">이름:</label>
            <input type="text" class="form-control" id="name" name="name" required>
        </div>
        <button type="submit" class="btn btn-success">회원 가입</button>
    </form>
</div>
<div th:replace="/common/footer.html"></div>
</body>
</html>
