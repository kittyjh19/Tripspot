<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity5">
<head>
  <meta charset="UTF-8">
  <title>TRIPSPOT</title>
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
</head>
<style>
  button{
    padding: 13px 30px;
    margin-top: 50px;
    font-size: 17px;
    font-family: 'Nanum Gothic', sans-serif;
    background-color: #FDFDFC;
    color: #256137;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    transition: background-color 0.3s;
  }

  button:hover{
    background-color: #C9E2D0;
  }

  .search-area {
    text-align: left; /* 왼쪽 정렬 */
    margin-left: 20px;
    margin-top: 60px;
  }

  .no-results {
    color: #256137;
    font-size: 50px;
    margin-top: 20px;
    margin-left: 20px;
  }

  .divider {
    width: calc(100% - 660px);
    border-top: 2px solid #BB9338;
    margin: 20px;
  }

  .random-title {
    margin-left: 20px; /* 왼쪽 정렬 조정 */
    display: block; /* 블록 요소로 변경 */
  }

  .search-table {
    width: calc(100% - 100px);
    border-collapse: collapse;
    margin-top: 10px;
    margin-left: 20px;
  }

  .search-table th, .search-table td {
    border: 1px solid #ccc;
    padding: 8px;
    text-align: center;
  }

  .search-table th {
    background-color: #ddd;
  }

  .search-table a {
    text-decoration: none;
    color: #256137;
  }

  .search-table a:hover {
    text-decoration: underline;
  }

</style>
<body>
<header>
  <h1>| TRIPSPOT</h1>
  <div style="text-align: right">
    <th:block sec:authorize="isAuthenticated()">
      <h3 style="text-align: right"><span sec:authentication="principal.username"></span>님</h3>
      <h3 style="text-align: right">
        권한:
        <span th:if="${#authorization.expression('isAuthenticated()')}">
        <span th:each="auth : ${#authentication.getAuthorities()}">
            <span th:text="${auth.authority == 'ROLE_USER' ? '일반 유저' : (auth.authority == 'ROLE_ADMIN' ? '관리자' : '알 수 없는 권한')}"></span>
        </span>
    </span>
        <span th:unless="${#authorization.expression('isAuthenticated()')}">권한 정보 없음</span>
      </h3>
      <button onclick="location.href='/member/logout'">로그아웃</button>
    </th:block>
    <th:block sec:authorize="isAnonymous()">
      <button class="register-button" onclick="location.href='/member/register'">회원가입</button>
      <button class="login-button" onclick="location.href='/member/login'">로그인</button>
    </th:block>
  </div>
</header>



<main>
  <div class="search-area">
    <input type="text" id="search-input" placeholder="검색할 지역을 입력하세요." />
  </div>

  <h1 class="no-results" th:if="${#lists.isEmpty(searchResults)}">
    <span th:text="${query}"></span> 지역에 대한 검색 결과가 없습니다.
  </h1>
  <div class="divider"></div>

  <h3 class="random-title">랜덤 추천 관광지</h3>
  <table class="search-table">
    <thead>
    <tr>
      <th>권역명</th>
      <th>관광지</th>
      <th>주소</th>
      <th>전화번호</th>
      <th>바로가기</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="result : ${randomResults}">
      <td th:text="${result.district}"></td>
      <td th:text="${result.title}"></td>
      <td th:text="${result.address}"></td>
      <td th:text="${result.phone}"></td>
      <td>
        <a th:href="@{/travel/details/{id}(id=${result.id})}" class="btn btn-primary">바로가기</a>
      </td>
    </tr>
    </tbody>
  </table>

</main>

<script>
  document.getElementById('search-input').addEventListener('keypress', function(event) {
    if (event.key === 'Enter') {
      const searchValue = this.value.trim(); // 입력된 값 가져오기
      if (!searchValue) return; // 빈 값이면 아무 동작 안 함

      // 바로 search 페이지로 이동
      window.location.href = `/search?query=${encodeURIComponent(searchValue)}`;
    }
  });
</script>

<footer>
  <p>Team 200-OK</p>
</footer>
</body>
</html>
