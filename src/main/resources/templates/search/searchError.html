<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity5">
<head>
  <meta charset="UTF-8">
  <title>TRIPSPOT</title>
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/search.css">
</head>
<style>
  button{
    padding: 13px 30px;
    margin-top: 50px;
    font-size: 17px;
    font-family: 'Nanum Gothic', sans-serif;
    background-color: #FDFDFC;
    color: #256137;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    transition: background-color 0.3s;
  }

  button:hover{
    background-color: #C9E2D0;
  }

  .search-area {
    text-align: center; /* 내부 요소들 가운데 정렬 */
    margin-top: 60px;
  }

  .no-results {
    color: #256137;
    font-size: 50px;
    margin-top: 20px;
    margin-left: auto; /* 왼쪽 마진 자동 */
    margin-right: auto; /* 오른쪽 마진 자동 */
    text-align: center; /* 텍스트도 가운데 정렬 */
    display: block; /* 블록 요소로 변경해야 `margin: auto;` 적용 가능 */
  }

</style>
<body>
<div th:replace="/common/header.html"></div>

<main>
  <div class="search-area">
    <input type="text" id="search-input" placeholder="검색할 지역을 입력하세요." />
  </div>

  <h1 class="no-results" th:if="${#lists.isEmpty(searchResults)}">
    '<span id="searchQuery" th:text="${query}"></span>'에 대한 검색 결과가 없습니다.
  </h1>
  <input type="hidden" id="districtName" value="">
  <div class="divider"></div>


</main>

<script>
  document.getElementById('search-input').addEventListener('keypress', function(event) {
    if (event.key === 'Enter') {
      const searchValue = this.value.trim(); // 입력된 값 가져오기
      if (!searchValue) return; // 빈 값이면 아무 동작 안 함

      // 바로 search 페이지로 이동
      window.location.href = `/search?query=${encodeURIComponent(searchValue)}`;
    }
  });
</script>

<div th:replace="/common/footer.html"></div>
</body>
</html>
